# ═══════════════════════════════════════════════════════════════
# Keeps the Supabase free-tier project awake.
#
# Free projects pause after 7 days with no API requests. A paused project
# means everyone gets errors until an admin manually resumes it from the
# dashboard — which is exactly what you don't want during a quiet fortnight
# between tender cycles.
#
# This pings the backend twice a week. GitHub Actions is free for public
# repos and gives 2,000 min/month on private ones; this uses ~10 sec/run.
#
# INSTALL: save as .github/workflows/keepalive.yml in the SAME repo that
# hosts your GitHub Pages frontend, then commit and push.
#
# ⚠ GitHub disables scheduled workflows in repos with no commits for 60
#   days and emails you first. Any commit re-enables them.
# ═══════════════════════════════════════════════════════════════
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 4 * * 1,4"      # 04:00 UTC = 09:30 IST, Mondays and Thursdays
  workflow_dispatch:           # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Set the BACKEND_URL secret to https://vjakvbaxkspozyplpnan.supabase.co/functions/v1/msetcl"
            exit 1
          fi
          echo "Pinging backend…"
          body=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 "$BACKEND_URL?action=ping")
          echo "$body"
          # A paused or broken project won't return ok:true — fail loudly so
          # the emailed run failure tells you before your users do.
          echo "$body" | grep -q '"ok":true' || { echo "::error::Backend did not report ok"; exit 1; }
